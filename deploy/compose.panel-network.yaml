# Магазин на одном сервере с панелью Remnawave (решение 0026).
# Веб и воркер подключаются к Docker-сети панели remnawave-network:
#   - Nginx или Caddy панели ходят к магазину по адресу remnabay:8000;
#   - панель шлёт вебхук по внутренней сети: http://remnabay:8000/webhooks/panel;
#   - PANEL_URL в .env можно указать внутренний: http://remnawave:3000.
# Подключение: COMPOSE_FILE=compose.yaml:compose.panel-network.yaml в .env.
services:
  web:
    networks:
      default:
      remnawave-network:
        aliases:
          - remnabay

  worker:
    networks:
      - default
      - remnawave-network

networks:
  remnawave-network:
    # Сеть создаёт compose панели; магазин к ней только подключается
    name: remnawave-network
    external: true
