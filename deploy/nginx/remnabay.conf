# RemnaBay на чистом сервере за Nginx сервера с сертификатом certbot (решение 0026).
# Положите файл в /etc/nginx/conf.d/remnabay.conf и замените shop.example.com
# на домен магазина (README.md). Веб открыт на 127.0.0.1:8000 (compose.yaml этой папки).

server {
    server_name shop.example.com;
    listen 80;
    listen [::]:80;

    # Проверка certbot при продлении сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name shop.example.com;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RemnaBaySSL:10m;
    ssl_session_tickets off;

    # Файл миграции — до 50 МБ, логотип — до 1 МБ
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
