# База магазина на другом сервере: встроенная PostgreSQL не запускается,
# адрес базы — DATABASE_URL в .env (решение 0073).
# Подключение: добавьте :compose.external-db.yaml в конец COMPOSE_FILE в .env.
x-external-db-environment: &external-db-environment
  # Без DATABASE_URL compose не запускается и называет параметр (1.1)
  DATABASE_URL: ${DATABASE_URL:?не задан — адрес внешней базы магазина, формат в .env.example}

services:
  db:
    # Профиль, который никто не включает: встроенная база не запускается
    profiles: ["disabled"]

  migrate:
    depends_on: !reset {}
    environment: *external-db-environment

  web:
    environment: *external-db-environment

  worker:
    environment: *external-db-environment
