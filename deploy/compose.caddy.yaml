# Чистый сервер: Caddy в контейнере, сертификаты он получает сам (решение 0026).
# Домен магазина — SHOP_DOMAIN в .env, без https:// и слеша (например, shop.example.com).
# Подключение: COMPOSE_FILE=compose.yaml:compose.caddy.yaml в .env.
services:
  caddy:
    image: caddy:2.11.7
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?не задан — домен магазина для Caddy, например shop.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и ключи Caddy: без тома он получал бы их заново при каждом запуске
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
