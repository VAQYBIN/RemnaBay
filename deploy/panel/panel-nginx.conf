# RemnaBay за Nginx панели Remnawave (решение 0026).
# Добавьте эти блоки в конец /opt/remnawave/nginx/nginx.conf, замените
# shop.example.com на домен магазина. Магазин подключён к сети панели
# compose.yaml из этой папки и доступен в ней как remnabay:8000.

server {
    server_name shop.example.com;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Сертификат домена магазина: свой, выпущенный как для панели, или тот же
    # сертификат на все поддомены (wildcard), что у панели, — README.md, вариант А или Б
    ssl_certificate "/etc/nginx/ssl/remnabay_fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/remnabay_privkey.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RemnaBaySSL:10m;
    ssl_session_tickets off;

    # Файл миграции — до 50 МБ, логотип — до 1 МБ
    client_max_body_size 60m;

    # Адрес магазина ищется DNS Docker при запросе, а не при запуске Nginx:
    # пока магазин остановлен, Nginx и панель за ним работают
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $remnabay http://remnabay:8000;

    location / {
        proxy_pass $remnabay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Перенаправление с HTTP на HTTPS. Работает, если у контейнера Nginx панели
# открыт порт 80 (README.md)
server {
    server_name shop.example.com;
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}
