# Публикация образа в GitHub Container Registry по тегу версии (решение 0073):
#   v<версия>       — выпуск, тег ставит владелец на main после слияния dev;
#   v<версия>-rc.<N> — предварительная версия для тестовых серверов, тег на ветке этапа.
# Образ ghcr.io/vaqybin/remnabay:<версия> для amd64 и arm64, без тега latest (0026).
name: Выпуск

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    name: Проверки
    uses: ./.github/workflows/ci.yml

  image:
    name: Образ для amd64 и arm64
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Тег v0.1.0-rc.1 выпускает версию 0.1.0 из pyproject.toml — иначе тег ошибочный
      - name: Тег совпадает с версией проекта
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${tag%%-*}" != "$project" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $project в pyproject.toml" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vaqybin/remnabay
          # Только номер версии: 0.1.0 или 0.1.0-rc.1
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
