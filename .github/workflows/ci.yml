# Проверки готовности задачи (CLAUDE.md, «Готовность»): линтер, типы, тесты,
# сборка админки и сборка образа. Образ здесь не публикуется — это этап 11.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — ruff, pyright, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: remnabay
          POSTGRES_PASSWORD: remnabay
          POSTGRES_DB: remnabay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remnabay -d remnabay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://remnabay:remnabay@localhost:5432/remnabay_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # у setup-uv нет плавающего тега основной версии
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Зависимости строго по uv.lock
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict)
        run: uv run pyright
      - name: pytest
        run: uv run pytest

  admin:
    name: Админка — типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Проверка типов TypeScript
        run: npm run typecheck
      - name: Сборка
        run: npm run build

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
