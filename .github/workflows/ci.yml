# Проверки готовности задачи (CLAUDE.md, «Готовность»): линтер, типы, тесты,
# сборка админки, сборка образа и файлы развёртывания. Образ здесь не публикуется —
# это делает release.yml по тегу версии (0073).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Те же проверки перед публикацией образа (release.yml)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — ruff, pyright, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: remnabay
          POSTGRES_PASSWORD: remnabay
          POSTGRES_DB: remnabay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remnabay -d remnabay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://remnabay:remnabay@localhost:5432/remnabay_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Зависимости строго по uv.lock
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict)
        run: uv run pyright
      - name: OpenAPI поддерживаемых версий панели для контрактного теста
        run: scripts/fetch-panel-openapi.sh
      - name: pytest
        run: uv run pytest

  admin:
    name: Админка — типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Проверка типов TypeScript
        run: npm run typecheck
      - name: Сборка
        run: npm run build

  admin-codegen:
    name: Админка — типы и бренд совпадают с бэкендом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/tools/openapi-typescript/package-lock.json
      - run: uv sync --locked
      # Схема API и токены бренда берутся при сборке (0049, 0050, 0051): если бэкенд
      # изменился, а файлы админки — нет, проверка падает
      - name: Перегенерировать типы клиента и токены бренда
        run: scripts/admin-codegen.sh
      - name: Файлы админки свежие
        run: git diff --exit-code -- admin/src/api/schema.d.ts admin/src/styles/default-brand.css

  docker:
    name: Сборка образа для amd64 и arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Обе архитектуры, что публикует release.yml (0026): ошибка сборки под arm64
      # видна до тега версии
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Развёртывание — прокси и compose для операторов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nginx -t и caddy validate для четырёх вариантов прокси (0026), compose во всех
      # сочетаниях и отказ без пароля встроенной базы (1.1, 0073)
      - name: Проверить deploy/
        run: scripts/check-deploy.sh
