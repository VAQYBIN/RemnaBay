# Автоматические предложения обновлений небольшими шагами (решение 0027).
# Каждое обновление проходит CI: типы и тесты.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # SDK панели обновляется только вместе с расширением диапазона
      # поддерживаемых версий панели, после контрактного теста (решение 0028)
      - dependency-name: remnawave-api
    groups:
      python-dev-tools:
        dependency-type: development

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    ignore:
      # Node — только LTS (0027): типы Node обновляются вместе с версией Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Генератор типов клиента админки: отдельный пакет с TypeScript 5 (решение 0051)
  - package-ecosystem: npm
    directory: /admin/tools/openapi-typescript
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript работает через API компилятора TypeScript 5
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python — переход на следующую версию по правилам 0027, не автоматически;
      # Node — только LTS
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Новая основная версия PostgreSQL требует переноса данных — только вручную
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
