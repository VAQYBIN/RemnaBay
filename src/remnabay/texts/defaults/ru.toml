# Единицы с множественным числом: подставляются в {days_text}, {period},
# {trial_period}, {minutes_text}. ПРЕДЛОЖЕНИЕ, НЕ УТВЕРЖДЕНО: в 03-bot-texts.md
# этих ключей нет — вопрос в docs/open-questions.md. Формы — по правилам языка
# (CLDR): для русского one — 1, 21; few — 2–4, 22–24; many — 0, 5–20, 25.
[plural."unit.days"]
one = "{count} день"
few = "{count} дня"
many = "{count} дней"
other = "{count} дня"

[plural."unit.minutes"]
one = "{count} минуту"
few = "{count} минуты"
many = "{count} минут"
other = "{count} минуты"
